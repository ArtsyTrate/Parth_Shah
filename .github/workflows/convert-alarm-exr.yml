name: Convert Alarm Clock EXR textures

on:
  push:
    branches:
      - react-3d-redesign
    paths:
      - ".github/workflows/convert-alarm-exr.yml"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: react-3d-redesign
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Convert EXR textures to PNG
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          exrs=(assets/Alarm_Clock/*.exr)

          if ((${#exrs[@]} == 0)); then
            echo "No EXR files found."
            exit 0
          fi

          for src in "${exrs[@]}"; do
            dst="${src%.exr}.png"
            echo "Converting $src -> $dst"

            case "$src" in
              *BaseColor*)
                ffmpeg -y -loglevel error -i "$src" \
                  -vf "zscale=transferin=linear:transfer=iec61966-2-1:primariesin=bt709:primaries=bt709:matrixin=gbr:matrix=bt709" \
                  -frames:v 1 -pix_fmt rgb24 "$dst"
                ;;
              *Normal*)
                ffmpeg -y -loglevel error -i "$src" -frames:v 1 -pix_fmt rgb24 "$dst"
                ;;
              *Height*)
                ffmpeg -y -loglevel error -i "$src" -frames:v 1 -pix_fmt gray16be "$dst"
                ;;
              *)
                ffmpeg -y -loglevel error -i "$src" -frames:v 1 -pix_fmt gray "$dst"
                ;;
            esac

            git rm "$src"
            git add "$dst"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace Alarm Clock EXR textures with PNG"
          git push origin HEAD:react-3d-redesign
