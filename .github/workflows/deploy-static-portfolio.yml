name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository and Git LFS assets
        uses: actions/checkout@v6
        with:
          lfs: true
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble the static site
        run: |
          mkdir -p _site
          cp index.html style.css script.js tokens.css base.css _site/
          cp Parth_Shah_Resume_3D.pdf _site/
          cp -R assets _site/assets
          touch _site/.nojekyll
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
